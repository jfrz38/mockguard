name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: make test

      - name: Resolve release version
        id: version
        run: |
          VERSION="$(make version)"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve project version" >&2
            exit 1
          fi
          SCANNER_VERSION="$(make scanner-version)"
          if [ -z "$SCANNER_VERSION" ]; then
            echo "Could not resolve scanner version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "scanner_version=$SCANNER_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build scanner release artifacts
        run: ./gradlew :mockguard-scanner:distZip :mockguard-scanner:distTar :mockguard-scanner:fatJar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SCANNER_VERSION: ${{ steps.version.outputs.scanner_version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists but the GitHub release is missing; creating it."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            "mockguard-scanner/build/libs/mockguard-scanner-$SCANNER_VERSION-cli.jar#mockguard-scanner-$SCANNER_VERSION-cli.jar" \
            "mockguard-scanner/build/distributions/mockguard-scanner-$SCANNER_VERSION.zip#mockguard-scanner-$SCANNER_VERSION.zip" \
            "mockguard-scanner/build/distributions/mockguard-scanner-$SCANNER_VERSION.tar#mockguard-scanner-$SCANNER_VERSION.tar"
